<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>QA-01 基础中文表单</title>
  <style>
    body { font-family: sans-serif; max-width: 640px; margin: 24px auto; }
    label { display: block; margin: 12px 0; font-weight: 600; }
    input, select, textarea { width: 100%; padding: 8px; box-sizing: border-box; }
  </style>
</head>
<body>
  <h1>QA-01 基础中文表单</h1>
  <form id="form" action="https://example.com/should-not-submit" method="post">
    <label>姓名 <input name="fullName" type="text" /></label>
    <label>邮箱 <input name="email" type="email" /></label>
    <label>电话 <input name="phone" type="tel" /></label>
    <label>城市 <input name="city" type="text" /></label>
    <label>学历
      <select name="education">
        <option value="">请选择</option>
        <option value="bachelor">本科</option>
        <option value="master">硕士</option>
      </select>
    </label>
    <label>自我评价 <textarea name="intro"></textarea></label>
    <input type="hidden" name="csrf" value="x" />
    <label>密码 <input name="password" type="password" /></label>
    <button type="submit" id="submitBtn">提交</button>
  </form>
  <script>
    document.getElementById('form').addEventListener('submit', (event) => {
      event.preventDefault();
      window.__qaSubmitted = true;
    });
  </script>
</body>
</html>
