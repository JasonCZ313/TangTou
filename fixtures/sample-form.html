<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>简历自动填写 — 样例表单</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        line-height: 1.5;
      }
      body {
        margin: 0;
        padding: 32px 20px 48px;
        background: linear-gradient(160deg, #f3f7fb 0%, #e8eef6 100%);
        color: #1a2332;
      }
      main {
        max-width: 560px;
        margin: 0 auto;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.5rem;
      }
      p {
        margin: 0 0 24px;
        color: #4a5a6d;
      }
      form {
        display: grid;
        gap: 16px;
      }
      label {
        display: grid;
        gap: 6px;
        font-weight: 600;
      }
      input,
      select,
      textarea {
        font: inherit;
        padding: 10px 12px;
        border: 1px solid #c5d0de;
        border-radius: 8px;
        background: #fff;
      }
      textarea {
        min-height: 120px;
        resize: vertical;
      }
      button[type="submit"] {
        justify-self: start;
        padding: 10px 18px;
        border: none;
        border-radius: 8px;
        background: #2f6fed;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }
      .hint {
        font-size: 0.875rem;
        font-weight: 400;
        color: #6a7a8c;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>样例投递表单</h1>
      <p>用于手动验收 Content 扫描 / 安全写入 / 撤销。扩展不得自动点击下方提交。</p>
      <form id="sample-application-form" action="#" method="post">
        <label>
          姓名
          <input id="full-name" name="fullName" type="text" placeholder="请输入姓名" required />
        </label>
        <label>
          邮箱
          <input id="email" name="email" type="email" placeholder="name@example.com" required />
        </label>
        <label>
          电话
          <input id="phone" name="phone" type="tel" placeholder="手机号码" />
        </label>
        <label>
          城市
          <input id="city" name="city" type="text" placeholder="所在城市" />
        </label>
        <label>
          学历
          <select id="education" name="education" required>
            <option value="">请选择</option>
            <option value="bachelor">本科</option>
            <option value="master">硕士</option>
            <option value="phd">博士</option>
            <option value="other">其他</option>
          </select>
        </label>
        <label>
          自我评价
          <textarea
            id="self-intro"
            name="selfIntro"
            placeholder="简要介绍你的优势与经历"
          ></textarea>
        </label>
        <label>
          补充说明（可编辑区域）
          <span class="hint">contenteditable 字段</span>
          <div
            id="extra-notes"
            contenteditable="true"
            role="textbox"
            aria-label="补充说明"
            style="min-height: 72px; padding: 10px 12px; border: 1px solid #c5d0de; border-radius: 8px; background: #fff;"
          ></div>
        </label>
        <!-- 以下控件应被扫描跳过：hidden / password / submit -->
        <input type="hidden" name="csrf" value="demo-token" />
        <label>
          密码（应跳过扫描）
          <input id="password" name="password" type="password" autocomplete="off" />
        </label>
        <button type="submit">提交投递（扩展不得点击）</button>
      </form>
    </main>
    <script>
      // 仅阻止本地打开时的默认提交跳转，方便手工点测；扩展本身不得调用 submit。
      document
        .getElementById('sample-application-form')
        .addEventListener('submit', function onSubmit(event) {
          event.preventDefault();
          alert('表单已手动提交（验收用）；扩展不应触发此行为。');
        });
    </script>
  </body>
</html>
